<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102a4f" />
    <meta name="description" content="Browse classic iPad 1st generation archive apps for iOS 2.x–5.x." />
    <title>iPad 1st Gen IPA Archive</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-icon">iPad</div>
          <div>
            <p class="eyebrow">Archive browser</p>
            <h1>iPad 1st Gen IPA Archive</h1>
          </div>
        </div>
        <div class="status-pill">iOS 2.2–5.0</div>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <section class="panel filters-panel">
            <div class="panel-header">
              <h2>Search archive</h2>
            </div>

            <label class="field-label" for="searchInput">App name / bundle</label>
            <input id="searchInput" type="search" placeholder="Search by app or bundle ID" />

            <div class="field-row">
              <div>
                <label class="field-label" for="minOsFilter">Minimum iOS</label>
                <select id="minOsFilter">
                  <option value="all">All versions</option>
                  <option value="2.2">iOS 2.2+</option>
                  <option value="2.2.1">iOS 2.2.1+</option>
                  <option value="3.0">iOS 3.0+</option>
                  <option value="3.1">iOS 3.1+</option>
                  <option value="3.1.2">iOS 3.1.2+</option>
                  <option value="3.1.3">iOS 3.1.3+</option>
                  <option value="3.2">iOS 3.2+</option>
                  <option value="4.0">iOS 4.0+</option>
                  <option value="5.0">iOS 5.0+</option>
                </select>
              </div>

              <div>
                <label class="field-label" for="sortFilter">Sort</label>
                <select id="sortFilter">
                  <option value="name">Name</option>
                  <option value="version">Version</option>
                  <option value="ios">Minimum iOS</option>
                </select>
              </div>
            </div>

            <button id="resetFilters" class="secondary-button" type="button">Reset filters</button>
          </section>

          <section class="panel stats-panel">
            <div class="panel-header">
              <h2>Collection</h2>
            </div>
            <div class="stats-grid">
              <div>
                <strong id="statsCount">0</strong>
                <span>Apps</span>
              </div>
              <div>
                <strong id="statsMin">0</strong>
                <span>Min iOS</span>
              </div>
              <div>
                <strong id="statsLatest">0</strong>
                <span>Latest</span>
              </div>
            </div>
          </section>
        </aside>

        <section class="content-panel">
          <div class="panel-header content-header">
            <div>
              <p class="eyebrow">Classic apps</p>
              <h2>Archive collection</h2>
            </div>
            <div id="resultsBadge" class="results-badge">0 results</div>
          </div>

          <div id="appList" class="app-list" aria-live="polite"></div>
        </section>

        <aside class="detail-panel">
          <div id="appDetail" class="app-detail" aria-live="polite"></div>
        </aside>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
